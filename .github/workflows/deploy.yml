name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy wsj
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Run deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            echo "=== Pulling latest changes on VPS ==="
            cd /root/wsj-next
            GIT_SSH_COMMAND="ssh -i /root/.ssh/id_ed25519_wsj -o IdentitiesOnly=yes" git pull origin main

            echo "=== Building Next.js production bundle ==="
            npm run build
            pm2 restart wsj-web

            echo "=== Building NestJS backend ==="
            cd /root/wsj-next/backend
            npm run build
            pm2 restart wsj-backend

            echo "=== Verifying health checks ==="
            sleep 4
            curl -sf http://127.0.0.1:4000/api/health | grep -q ok && echo "API healthy"
            curl -sf http://127.0.0.1:3600/ | grep -qi html && echo "Web healthy"
            echo "=== Deployment to wp.workspacejunction.com complete! ==="
