name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy wsj
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # ── Build check (catches compile errors before touching the server) ──
      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          API_URL: http://localhost:4000/api
          NEXT_PUBLIC_API_URL: https://wp.workspacejunction.com/api

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      # ── Deploy ──
      - name: Copy code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: /root/wsj-deploy-staging
          overwrite: true
          exclude: |
            .git
            node_modules
            .next
            backend/node_modules
            backend/dist

      - name: Run deploy script on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /root/deploy.sh
          command_timeout: 25m

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            curl -sf https://wp.workspacejunction.com/api/health | grep -q ok && echo "API healthy" || exit 1
